name: Propose a new hook
description: Suggest a hook that should ship with this collection.
title: "[hook] "
labels: [new-hook]
body:
  - type: input
    id: name
    attributes:
      label: Proposed hook name
      description: kebab-case, matches the eventual filename.
      placeholder: block-aws-billing-spike
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - ai
        - automation
        - context
        - cost
        - devops
        - fun
        - git
        - notifications
        - prompt
        - quality
        - security
        - session
    validations:
      required: true

  - type: dropdown
    id: event
    attributes:
      label: Hook event
      description: See https://code.claude.com/docs/en/hooks for semantics.
      options:
        - SessionStart
        - UserPromptSubmit
        - UserPromptExpansion
        - PreToolUse
        - PermissionRequest
        - PermissionDenied
        - PostToolUse
        - PostToolUseFailure
        - PostToolBatch
        - Notification
        - SubagentStart
        - SubagentStop
        - TaskCreated
        - TaskCompleted
        - Stop
        - StopFailure
        - TeammateIdle
        - InstructionsLoaded
        - ConfigChange
        - CwdChanged
        - FileChanged
        - WorktreeCreate
        - WorktreeRemove
        - PreCompact
        - PostCompact
        - Elicitation
        - ElicitationResult
        - SessionEnd
    validations:
      required: true

  - type: input
    id: matcher
    attributes:
      label: Matcher (if PreToolUse/PostToolUse)
      placeholder: 'Bash  or  Write|Edit|MultiEdit'

  - type: textarea
    id: what
    attributes:
      label: What it does
      description: One paragraph. Concrete behavior, not marketing.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it belongs in this collection
      description: |
        What hook in the existing 79 doesn't already do this? If something
        close exists, why does this need to be separate (different event,
        different matcher, different blocking semantics, different env)?
    validations:
      required: true

  - type: dropdown
    id: risk_level
    attributes:
      label: Risk level
      description: |
        Match the categories defined in SECURITY_MODEL.md. Pick the highest
        applicable level.
      options:
        - passive (read-only, no side effects)
        - contextual (injects additionalContext, no system side effects)
        - modifying (writes local files / logs / formatted code)
        - blocking (returns permissionDecision deny)
        - networked (calls Slack, webhooks, third-party APIs)
        - privileged (invokes kubectl, aws, terraform, docker, gcloud, helm)
    validations:
      required: true

  - type: input
    id: bypass
    attributes:
      label: Bypass env var
      description: If the hook can block, propose a `CLAUDE_*` env var to disable it.
      placeholder: CLAUDE_ALLOW_BILLING_SPIKE

  - type: checkboxes
    id: quality_bar
    attributes:
      label: Quality bar (what you'll deliver)
      description: Pick one. Honesty here helps us route review.
      options:
        - label: I will write the hook + bats test + hero doc
          required: false
        - label: I will write only the hook
          required: false
        - label: I'm just proposing — someone else can build it
          required: false

  - type: checkboxes
    id: contract
    attributes:
      label: Contract
      options:
        - label: I've read docs/hook-contract.md
          required: true
        - label: A bats test is feasible (no network, no human input)
          required: false
        - label: I'm willing to open the PR myself
          required: false
