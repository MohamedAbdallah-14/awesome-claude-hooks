name: Bug report
description: A hook misbehaves, a script breaks, or the docs lie.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. A reproducible payload helps us land a fix fast.
        For security issues, **do not file a public bug** — use the security
        advisory link from the issue chooser.

  - type: input
    id: hook
    attributes:
      label: Hook
      description: Path of the hook that misbehaved.
      placeholder: hooks/security/block-secrets.sh
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Repo version or commit
      description: Run `cat VERSION` or paste the commit SHA you have checked out.
      placeholder: "0.2.0 or 7de8b31"
    validations:
      required: true

  - type: input
    id: claude_code_version
    attributes:
      label: Claude Code version
      description: Run `claude --version`.
      placeholder: "1.0.42"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - WSL
        - Other
    validations:
      required: true

  - type: input
    id: bash
    attributes:
      label: bash version
      description: Run `bash --version | head -1`.
    validations:
      required: true

  - type: input
    id: jq
    attributes:
      label: jq version
      description: Run `jq --version`.
    validations:
      required: true

  - type: textarea
    id: payload
    attributes:
      label: Reproduction payload
      description: |
        Paste the exact JSON payload that triggered the bug, OR the
        `bats` test that fails. Use `tests/test_helper.bash` helpers if useful.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exit code and any stdout/stderr.
      render: shell
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: hook-doctor output (optional)
      description: |
        If you ran `bash scripts/hook-doctor.sh`, paste the output here.
        Helps us rule out environment issues fast.
      render: shell

  - type: checkboxes
    id: prereqs
    attributes:
      label: Sanity checks
      options:
        - label: I confirmed this is not a Claude Code spec issue (see https://code.claude.com/docs/en/hooks). If it is, I'll file a spec-drift report instead.
          required: true
        - label: I searched existing issues for duplicates
          required: true
        - label: I ran `bash scripts/lint-hooks.sh` and it passes on my checkout
          required: false
        - label: I ran `shellcheck -S warning` against the hook and it's clean
          required: false
        - label: I ran `bash scripts/hook-doctor.sh` and pasted the output above
          required: false
