name: Pages

# Deploy the static catalog browser at docs-site/ to GitHub Pages.
#
# Triggers:
#   - workflow_run: only after CI on main succeeds (so we never publish a
#     site built from a red commit).
#   - workflow_dispatch: manual rebuild without waiting for a CI run.
#
# The path filter on the underlying push (`docs-site/**`,
# `hooks.registry.json`) is enforced inside the job, since `workflow_run`
# itself doesn't accept paths.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A single in-flight deploy at a time. Don't cancel — let in-progress
# deploys finish so we don't leave the site in a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      should-deploy: ${{ steps.changed.outputs.should-deploy }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
      FALLBACK_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # For workflow_run we want the SHA that triggered CI, not the
          # default ref (which would be `main` HEAD and might already have
          # moved on). Fall back to github.sha for workflow_dispatch.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Decide whether to deploy
        id: changed
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          if [ -z "$base" ]; then
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -E '^(docs-site/|hooks\.registry\.json$)' >/dev/null; then
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
            echo "No site-relevant changes; skipping deploy."
          fi

      - name: Stage site
        if: steps.changed.outputs.should-deploy == 'true'
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R docs-site/. _site/
          cp hooks.registry.json _site/registry.json
          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/app.js
          test -f _site/registry.json
          ls -la _site

      - name: Configure Pages
        if: steps.changed.outputs.should-deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: steps.changed.outputs.should-deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    if: needs.build.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
