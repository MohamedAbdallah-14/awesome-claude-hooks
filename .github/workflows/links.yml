name: Link check

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/links.yml'
      - '.lycheeignore'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref/PR.
concurrency:
  group: links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only the scheduled run opens an issue on failure; PR runs don't need it,
      # but we keep the permission narrow at the job level rather than per-step.
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.0

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.7.0
        with:
          args: >-
            --no-progress
            --include-fragments
            --accept '100..=103,200..=299'
            './**/*.md'
          fail: true
          format: markdown

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Broken links detected by scheduled lychee run"
          content-filepath: ./lychee/out.md
          labels: bug,docs,area:docs
