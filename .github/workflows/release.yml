name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# OIDC note: we don't publish to npm/PyPI/registry today, so `id-token: write`
# is intentionally omitted. When we add a registry publish step, switch to
# trusted publishing (OIDC) instead of long-lived API tokens — see
# https://docs.pypi.org/trusted-publishers/ and
# https://docs.npmjs.com/generating-provenance-statements.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.0
        with:
          fetch-depth: 0

      - name: Verify tag matches VERSION
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          file_version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GIT_TAG#v}"
          if [ "$file_version" != "$tag_version" ]; then
            echo "VERSION ($file_version) does not match tag ($tag_version)" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          version="${GIT_TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No CHANGELOG section found for [${version}]" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$GIT_TAG" \
            --title "$GIT_TAG" \
            --notes-file release-notes.md
