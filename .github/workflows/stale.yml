name: Close stale issues and PRs

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-message: |
            This issue has been inactive for 60 days. It will be closed in 14 days unless someone comments. Add the `pinned` label or post an update to keep it open.
          close-issue-message: |
            Closing for inactivity. Reopen if it's still relevant.
          stale-issue-label: stale
          exempt-issue-labels: pinned,security,good-first-issue

          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-message: |
            This PR has been inactive for 30 days. It will be closed in 14 days unless updated. Push a new commit or comment to keep it open.
          close-pr-message: |
            Closing for inactivity. Feel free to reopen with a rebase.
          stale-pr-label: stale
          exempt-pr-labels: pinned,security
