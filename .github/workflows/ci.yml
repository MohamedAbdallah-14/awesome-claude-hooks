name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck --version
          shellcheck -S warning hooks/**/*.sh scripts/*.sh

  lint-hooks:
    name: hook contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y jq
      - run: bash scripts/lint-hooks.sh

  bats:
    name: bats tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bats and jq (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats jq python3-yaml

      - name: Install bats and jq (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bats-core jq
          python3 -m pip install --user --break-system-packages pyyaml || true

      - name: Run tests
        run: bats -r tests
