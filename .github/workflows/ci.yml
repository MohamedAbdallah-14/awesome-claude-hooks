name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. PRs from forks cannot escalate.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck --version

      # `-f gcc` produces output GitHub Actions parses into PR annotations.
      # The matcher line below registers the gcc-style pattern.
      - name: Enable problem matcher
        run: echo "::add-matcher::.github/matchers/shellcheck.json"

      - name: Run shellcheck
        run: |
          set -o pipefail
          shellcheck -S warning -f gcc \
            hooks/**/*.sh hooks/_lib/*.sh scripts/*.sh

  lint-hooks:
    name: hook contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y jq

      - name: Enable problem matcher
        run: echo "::add-matcher::.github/matchers/lint-hooks.json"

      - name: Run hook contract linter
        run: bash scripts/lint-hooks.sh

  registry-drift:
    name: registry + docs drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: "3.x"

      - name: Rebuild registry + docs
        run: |
          python3 scripts/build-registry.py
          python3 scripts/render-docs.py

      - name: Fail if anything drifted
        run: |
          if ! git diff --quiet -- hooks.registry.yaml hooks.registry.json docs/hooks.md docs/events.md docs/compatibility.md; then
            echo "::error::hooks.registry.* or generated docs are out of sync. Run 'make all' locally." >&2
            git --no-pager diff -- hooks.registry.yaml hooks.registry.json docs/hooks.md docs/events.md docs/compatibility.md | head -200
            exit 1
          fi

  bash-3.2-compat:
    name: bash 3.2 syntax (hooks/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0

      # macOS still ships bash 3.2 as /bin/bash, and so do many minimal Linux
      # containers. Build it from source once, cache it, then `bash -n` every
      # hook to catch bash-4-only constructs at parse time.
      - name: Cache bash 3.2 build
        id: cache-bash32
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
        with:
          path: ~/.cache/bash-3.2/bin
          key: bash-3.2.57-${{ runner.os }}-v2

      - name: Install build deps
        if: steps.cache-bash32.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential wget

      - name: Build bash 3.2
        if: steps.cache-bash32.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/bash-3.2"
          cd "$(mktemp -d)"
          wget -q https://ftp.gnu.org/gnu/bash/bash-3.2.tar.gz
          tar xf bash-3.2.tar.gz
          cd bash-3.2
          # bash 3.2 doesn't build cleanly with modern glibc/gcc without a few
          # warning suppressions; -w + -std=gnu89 keeps the configure script
          # happy on ubuntu-latest.
          ./configure --prefix="$HOME/.cache/bash-3.2" CFLAGS="-w -std=gnu89 -O2" >/dev/null
          make -j"$(nproc)" >/dev/null
          make install >/dev/null
          "$HOME/.cache/bash-3.2/bin/bash" --version | head -1

      - name: Verify bash 3.2 binary
        run: |
          BASH32="$HOME/.cache/bash-3.2/bin/bash"
          test -x "$BASH32" || { echo "bash 3.2 binary missing at $BASH32" >&2; exit 1; }
          "$BASH32" --version | head -1
          # Sanity: must report 3.2.x.
          "$BASH32" -c 'echo "$BASH_VERSION"' | grep -q '^3\.2' \
            || { echo "expected bash 3.2, got something else" >&2; exit 1; }

      - name: Syntax-check every hook under bash 3.2
        # Hooks must run on stock macOS bash. Scripts in scripts/ are exempt
        # (they're maintenance tooling and may legitimately use bash 4+).
        run: |
          set -euo pipefail
          BASH32="$HOME/.cache/bash-3.2/bin/bash"
          fail=0
          while IFS= read -r f; do
            if ! "$BASH32" -n "$f" 2>/tmp/bash32.err; then
              echo "::error file=$f::bash 3.2 syntax error"
              cat /tmp/bash32.err >&2
              fail=1
            fi
          done < <(find hooks -name '*.sh' -type f | sort)
          if [ "$fail" -ne 0 ]; then
            echo "One or more hooks fail bash 3.2 syntax check." >&2
            exit 1
          fi
          echo "All hooks pass bash 3.2 -n."

  bats:
    name: bats (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0

      - name: Install bats and jq (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats jq python3-yaml

      - name: Install bats and jq (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bats-core jq
          python3 -m pip install --user --break-system-packages pyyaml

      - name: Run tests
        # CI has no TTY; --pretty calls tput which then barfs on broken pipes.
        # The default TAP formatter is what we want here anyway.
        run: bats -r tests

  required-checks:
    # Aggregator job so branch protection only needs one required check.
    name: required checks
    needs: [shellcheck, lint-hooks, registry-drift, bats, bash-3.2-compat]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all jobs succeeded
        env:
          SHELLCHECK: ${{ needs.shellcheck.result }}
          LINT_HOOKS: ${{ needs.lint-hooks.result }}
          REGISTRY: ${{ needs.registry-drift.result }}
          BATS: ${{ needs.bats.result }}
          BASH32: ${{ needs['bash-3.2-compat'].result }}
        run: |
          echo "shellcheck=$SHELLCHECK"
          echo "lint-hooks=$LINT_HOOKS"
          echo "registry-drift=$REGISTRY"
          echo "bats=$BATS"
          echo "bash-3.2-compat=$BASH32"
          if [ "$SHELLCHECK" != "success" ] || [ "$LINT_HOOKS" != "success" ] || [ "$REGISTRY" != "success" ] || [ "$BATS" != "success" ] || [ "$BASH32" != "success" ]; then
            echo "One or more required checks failed." >&2
            exit 1
          fi
