# Single source of truth for the hook catalog.
# Generated by scripts/build-registry.py — do not edit by hand.
#
# Re-run after adding / removing / renaming any hook:
#   python3 scripts/build-registry.py

version: 1
hook_count: 90

profiles:
  safe-default:
    - audit-bash-commands
    - audit-file-writes
    - session-summary
    - context-threshold-guard
    - desktop-notify
  security:
    - block-secrets
    - protect-dotenv
    - block-dangerous-bash
    - block-system-paths
    - scan-sql-injection
    - check-npm-audit
    - audit-bash-commands
    - audit-file-writes
  quality:
    - eslint-gate
    - prettier-gate
    - tsc-check
    - validate-json-yaml
    - python-lint
    - dart-analyze
    - go-vet
    - test-coverage-check
  team:
    - protect-main-branch
    - validate-commit-message
    - audit-file-writes
    - session-summary
    - conflict-detector
    - stash-guard
  devops:
    - terraform-destroy-guard
    - kubernetes-prod-guard
    - aws-prod-guard
    - db-migration-guard
    - docker-prod-guard
    - github-actions-validator
    - infra-audit-log
  solo-dev:
    - auto-format-on-save
    - ai-commit-message
    - session-name-from-branch
    - desktop-notify
    - session-start-context
  notifications:
    - desktop-notify
    - macos-notify
    - linux-notify
    - slack-notify
    - telegram-notify
    - discord-notify
    - pushover-notify
    - sound-complete
    - sound-error
    - terminal-title
  ai-assisted:
    - ai-code-review
    - ai-security-scan
    - ai-commit-message
    - ai-pr-description
    - ai-migration-safety

hooks:
  - id: ai-code-review
    category: ai
    path: hooks/ai/ai-code-review.sh
    event: PostToolUse
    matcher: ""
    description: "After each file write, sends the content to Claude Haiku (~$0.001) for a 2-sentence code review. Flags only security vulnerabilities, off-by-one errors, or obvious bugs. Skips files >100 lines and non-code file types. If clean, Haiku replies \"LGTM\" and the hook stays silent."
    risk_level: networked
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: false
    network_access: true
    bypass_env:[]
    profiles:
      - ai-assisted
    tests: null

  - id: ai-commit-message
    category: ai
    path: hooks/ai/ai-commit-message.sh
    event: Stop
    matcher: ""
    description: At session end, checks if the last commit message is generic (≤15 chars or matches common lazy patterns). If so, calls Haiku with the diff stat to suggest a conventional commit message. Purely advisory — outputs additionalContext, never blocks.
    risk_level: networked
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: false
    network_access: true
    bypass_env:[]
    profiles:
      - solo-dev
      - ai-assisted
    tests: null

  - id: ai-migration-safety
    category: ai
    path: hooks/ai/ai-migration-safety.sh
    event: PreToolUse
    matcher: Bash
    description: Intercepts bash commands that look like database migrations. Asks Haiku whether the migration is REVERSIBLE, IRREVERSIBLE, or UNKNOWN. Blocks with exit 2 only if IRREVERSIBLE. Passes through if REVERSIBLE, UNKNOWN, or if the API key is absent.
    risk_level: blocking
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: true
    writes_files: false
    network_access: true
    bypass_env:[]
    profiles:
      - ai-assisted
    tests: tests/ai/ai-migration-safety.bats

  - id: ai-pr-description
    category: ai
    path: hooks/ai/ai-pr-description.sh
    event: Stop
    matcher: ""
    description: "At session end, checks for commits on the current branch that aren't in main. If ≥2 new commits exist, calls Haiku to draft a PR description and writes it to /tmp/claude-pr-draft.md. Outputs the file path as additionalContext. Non-blocking."
    risk_level: networked
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: false
    network_access: true
    bypass_env:[]
    profiles:
      - ai-assisted
    tests: null

  - id: ai-security-scan
    category: ai
    path: hooks/ai/ai-security-scan.sh
    event: PostToolUse
    matcher: ""
    description: After each file write to .py/.js/.ts/.go files, asks Haiku to scan for OWASP Top 10 vulnerabilities. Injects findings as context only when issues are found. Scans first 50 lines max.
    risk_level: networked
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: false
    network_access: true
    bypass_env:
      - CLAUDE_SKIP_AI_SECURITY
    profiles:
      - ai-assisted
    tests: null

  - id: auto-changelog
    category: automation
    path: hooks/automation/auto-changelog.sh
    event: Stop
    matcher: ""
    description: "Appends a dated entry to CHANGELOG.md when Claude finishes a session that produced file changes. The entry summary is taken from the last user message in the transcript (what Claude was asked to do). # Entry format: ## YYYY-MM-DD - {summary_from_transcript} # If CHANGELOG.md does not exist it is created with a header. Skips silently if no file changes were made during the session."
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_AUTO_CHANGELOG
      - CLAUDE_CHANGELOG_FILE
    profiles:[]
    tests: tests/automation/auto-changelog.bats

  - id: auto-format-on-save
    category: automation
    path: hooks/automation/auto-format-on-save.sh
    event: PostToolUse
    matcher: Write|Edit|MultiEdit
    description: "Universal formatter. Detects the file type and runs the appropriate formatter. Falls back gracefully if the formatter is not installed — never blocks Claude. # Formatter selection by extension: .js .jsx .ts .tsx → prettier (then eslint --fix as fallback) .py → black (then autopep8, then ruff format) .go → gofmt -w .dart → dart format .rs → rustfmt .sh .bash → shfmt -w"
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_AUTOFORMAT_ENABLED
      - CLAUDE_AUTOFORMAT_SKIP_TYPES
    profiles:
      - solo-dev
    tests: tests/automation/auto-format-on-save.bats

  - id: auto-git-commit
    category: automation
    path: hooks/automation/auto-git-commit.sh
    event: Stop
    matcher: ""
    description: "When Claude's session ends, stages all modified tracked files and commits them. Commit message is derived from Claude's last response in the transcript, prefixed with \"claude:\". # Safety guards: - Off by default (must set CLAUDE_AUTO_COMMIT=1) - Skips if no changes are present - Never commits on protected branches (main, master by default) - Never commits if git is not available or cwd is not a repo"
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_AUTO_COMMIT
      - CLAUDE_AUTO_COMMIT_BRANCH_PROTECTION
    profiles:[]
    tests: tests/automation/auto-git-commit.bats

  - id: auto-prettier
    category: automation
    path: hooks/automation/auto-prettier.sh
    event: PostToolUse
    matcher: Write|Edit|MultiEdit
    description: "Automatically runs prettier --write on JS/TS/CSS/JSON/MD files after Claude writes or edits them. Keeps code consistently formatted without a separate formatting pass. # Matches: .js .jsx .ts .tsx .css .scss .json .md .mdx .yaml .yml"
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_PRETTIER_SKIP_PATTERNS
    profiles:[]
    tests: tests/automation/auto-prettier.bats

  - id: auto-push
    category: automation
    path: hooks/automation/auto-push.sh
    event: Stop
    matcher: ""
    description: "After a Claude session ends, pushes the current branch to its upstream remote — but only if the last commit was made by Claude (identified by a \"claude:\" message prefix). This makes auto-push safe to pair with auto-git-commit without accidentally pushing manual commits. # Safety guards: - Off by default (must set CLAUDE_AUTO_PUSH=1) - Never pushes to main/master (configurable) - Only pushes if HEAD commit message starts with \"claude:\" - Skips if no upstream is configured - Never force-pushes"
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_AUTO_PUSH
      - CLAUDE_AUTO_PUSH_PROTECTED
    profiles:[]
    tests: tests/automation/auto-push.bats

  - id: auto-run-tests
    category: automation
    path: hooks/automation/auto-run-tests.sh
    event: PostToolUse
    matcher: Write|Edit|MultiEdit
    description: "After Claude writes a source file, finds the related test file by convention and runs it. Supports Jest (TS/JS), pytest (Python), Go test, and Dart/Flutter test. # Test discovery conventions: foo.ts → foo.test.ts or __tests__/foo.test.ts foo.py → test_foo.py or foo_test.py or tests/test_foo.py foo.go → foo_test.go (same directory) foo.dart → foo_test.dart or test/foo_test.dart # Only runs if the related test file actually exists. Does NOT run tests for test files themselves (avoids double runs)."
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_AUTO_TEST_ENABLED
      - CLAUDE_AUTO_TEST_TIMEOUT
    profiles:[]
    tests: tests/automation/auto-run-tests.bats

  - id: auto-update-readme
    category: automation
    path: hooks/automation/auto-update-readme.sh
    event: PostToolUse
    matcher: Write|Edit|MultiEdit
    description: "When Claude updates a manifest file (package.json, pubspec.yaml, pyproject.toml, Cargo.toml), extracts the new version and updates matching version references in README.md: # - Shields.io / img.shields.io version badges [![version](https://img.shields.io/badge/version-x.y.z-...)] - Plain \"version: x.y.z\" or \"version = \"x.y.z\"\" lines # Only triggers for the four manifest file names listed above. Skips silently if README.md is absent or contains no version refs."
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_AUTO_UPDATE_README
    profiles:[]
    tests: tests/automation/auto-update-readme.bats

  - id: inject-docker-status
    category: context
    path: hooks/context/inject-docker-status.sh
    event: PreToolUse
    matcher: ""
    description: "When Claude is about to run a command that involves Docker, inject the current state of running containers so Claude knows what's already up before issuing docker run / up / exec. # Triggers on commands containing: docker, docker-compose, docker compose. # Gracefully no-ops if Docker is not installed or the daemon is not running (returns approve with no context rather than blocking or erroring)."
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:[]
    profiles:[]
    tests: tests/context/inject-docker-status.bats

  - id: inject-env-summary
    category: context
    path: hooks/context/inject-env-summary.sh
    event: Stop
    matcher: ""
    description: "After each response, writes a safe environment snapshot to ~/.claude/context/env-summary.md covering tool versions, OS details, Docker state, and git remote. # Security note: this hook NEVER reads or emits env var VALUES. It only lists the names of non-empty env vars in the shell environment, so secrets stay out of Claude's context."
    risk_level: modifying
    platforms:
      - macos
      - linux
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_ENV_SUMMARY_INCLUDE_VERSIONS
    profiles:[]
    tests: tests/context/inject-env-summary.bats

  - id: inject-file-history
    category: context
    path: hooks/context/inject-file-history.sh
    event: PreToolUse
    matcher: ""
    description: "When Claude reads a file, inject: - Who last modified it and when (git blame last committer) - How many commits touched it in the last 30 days - Whether the file contains open TODO or FIXME markers # Only runs for files tracked in git. Silently approves for untracked files, binaries, or directories."
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:[]
    profiles:[]
    tests: tests/context/inject-file-history.bats

  - id: inject-git-context
    category: context
    path: hooks/context/inject-git-context.sh
    event: Stop
    matcher: ""
    description: "After each response, writes a git context summary to ~/.claude/context/git-status.md so Claude has up-to-date repo state at the start of the next turn. Captures: current branch, short status, last 3 commits, and any merge conflict markers."
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_GIT_CONTEXT_MAX_FILES
    profiles:[]
    tests: tests/context/inject-git-context.bats

  - id: inject-package-info
    category: context
    path: hooks/context/inject-package-info.sh
    event: PreToolUse
    matcher: ""
    description: "When Claude is about to edit a dependency manifest (package.json, pubspec.yaml, requirements.txt, go.mod), inject a human-readable summary of the current package state so Claude understands what's already declared before adding or modifying dependencies. # Supported formats: package.json → name, version, top 10 deps + devDeps pubspec.yaml → name, version, dependencies block requirements.txt → line count + first 20 entries go.mod → module name, go version, first 10 require entries"
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:[]
    profiles:[]
    tests: tests/context/inject-package-info.bats

  - id: inject-recent-commits
    category: context
    path: hooks/context/inject-recent-commits.sh
    event: PreToolUse
    matcher: ""
    description: "Before Claude edits a file, injects that file's recent git log as context so Claude knows what changed and why before modifying. Outputs JSON with decision + context fields. Silently approves if file is untracked or git is unavailable."
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_GIT_LOG_COUNT
    profiles:[]
    tests: tests/context/inject-recent-commits.bats

  - id: inject-test-results
    category: context
    path: hooks/context/inject-test-results.sh
    event: Stop
    matcher: ""
    description: "After each response, scans for recent test output and writes a summary to ~/.claude/context/test-results.md so Claude knows the current pass/fail state before suggesting the next step. # Detection order (first match wins): 1. $CLAUDE_TEST_RESULTS_FILE — explicit path to any test output 2. jest --json output at common locations (jest-results.json, test-results.json, coverage/test-results.json) 3. pytest --tb=no -q output cached at /tmp/claude-pytest-*.txt 4. Generic last-run file at /tmp/claude-test-output.txt"
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_TEST_RESULTS_FILE
    profiles:[]
    tests: tests/context/inject-test-results.bats

  - id: inject-typescript-errors
    category: context
    path: hooks/context/inject-typescript-errors.sh
    event: PreToolUse
    matcher: ""
    description: "Before Claude edits a .ts or .tsx file, runs tsc --noEmit and injects the current error count + first 20 diagnostics as context. Results are cached for 30 seconds to avoid hammering tsc on every keystroke when multiple files are being edited. # Non-blocking heuristic: if tsc takes longer than CLAUDE_TSC_TIMEOUT seconds, the hook approves immediately with a timeout note."
    risk_level: modifying
    platforms:
      - macos
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_TSC_TIMEOUT
    profiles:[]
    tests: tests/context/inject-typescript-errors.bats

  - id: budget-alert
    category: cost
    path: hooks/cost/budget-alert.sh
    event: PostToolUse
    matcher: ""
    description: "Tracks a per-session operation count as a proxy for cost. There is no direct API cost data in hook payloads, so operation count is the best available signal. # At soft threshold (default 50): sends a desktop notification. At hard threshold (default 200): notifies AND emits a JSON context block asking Claude to pause and review. # Counter file: /tmp/claude-ops-{session_id}.count Notification thresholds: 50, 100, 200"
    risk_level: modifying
    platforms:
      - macos
      - linux
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_BUDGET_HARD_LIMIT
      - CLAUDE_BUDGET_SOFT_LIMIT
    profiles:[]
    tests: tests/cost/budget-alert.bats

  - id: daily-usage-report
    category: cost
    path: hooks/cost/daily-usage-report.sh
    event: Stop
    matcher: ""
    description: "Generates a brief Markdown summary of today's Claude usage once per calendar day. Reads ~/.claude/usage.csv (from log-tool-usage) and ~/.claude/sessions.log (from session-timer) to produce: # - Total sessions today - Total tool calls today - Top 5 most-used tools - Total time spent (sum of session durations) - Files most often edited (top 5 Write/Edit paths) # Output: ~/.claude/reports/YYYY-MM-DD.md Guard: /tmp/claude-daily-report-YYYY-MM-DD.done (one run/day)"
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_DAILY_REPORT_PATH
      - CLAUDE_SESSION_LOG
      - CLAUDE_USAGE_LOG
    profiles:[]
    tests: null

  - id: log-bash-history
    category: cost
    path: hooks/cost/log-bash-history.sh
    event: PostToolUse
    matcher: Bash
    description: "Appends every Bash command Claude runs to a persistent history log. Useful for auditing, debugging, and reproducing sessions. # Log format (pipe-delimited): ISO_TIMESTAMP | session_id | COMMAND | EXIT_CODE # Exit code detection: if tool_response.stderr is non-empty and stdout doesn't end with a zero-exit indicator, marks as FAIL. This is heuristic — the hook payload doesn't carry a raw exit code, so we infer from stderr presence. # Example: 2026-04-26T02:15:03+00:00 | abc123 | git status | 0 2026-04-26T02:15:04+00:00 | abc123 | rm -rf /oops | ERR"
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_BASH_HISTORY_LOG
    profiles:[]
    tests: tests/cost/log-bash-history.bats

  - id: log-tool-usage
    category: cost
    path: hooks/cost/log-tool-usage.sh
    event: PostToolUse
    matcher: ""
    description: "Appends a structured CSV entry for every tool call Claude makes. Gives you a full audit trail of everything Claude touched across all sessions. Rotate-safe: moves to usage.csv.1 when >5 MB. # CSV columns: ISO_TIMESTAMP, session_id, tool_name, file_path_or_command # - file_path: tool_input.file_path if present - command: first 80 chars of tool_input.command for Bash calls - empty string for tools with neither # Note: duration_ms is not available from the hook payload. Log each call with its timestamp; diff adjacent lines offline to compute elapsed time between calls."
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_USAGE_LOG
    profiles:[]
    tests: tests/cost/log-tool-usage.bats

  - id: session-timer
    category: cost
    path: hooks/cost/session-timer.sh
    event: PreToolUse
    matcher: ""
    description: "Tracks how long each Claude session runs and how many tool calls it makes. Writes a log line to ~/.claude/sessions.log when the session ends. # Log format (pipe-delimited): ISO_DATE | session_id | duration_seconds | tool_call_count # Example: 2026-04-26 | abc123 | 742 | 87 # Mechanism: PreToolUse — on first call, writes epoch to /tmp/claude-session-{id}.start increments /tmp/claude-session-{id}.count Stop — reads both tmp files, computes elapsed, logs, then removes tmp files."
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_SESSION_LOG
    profiles:[]
    tests: tests/cost/session-timer.bats

  - id: aws-prod-guard
    category: devops
    path: hooks/devops/aws-prod-guard.sh
    event: PreToolUse
    matcher: Bash
    description: Blocks destructive AWS CLI commands targeting production profiles.
    risk_level: blocking
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: true
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_ALLOW_AWS_PROD
    profiles:
      - devops
    tests: tests/devops/aws-prod-guard.bats

  - id: db-migration-guard
    category: devops
    path: hooks/devops/db-migration-guard.sh
    event: PreToolUse
    matcher: Bash
    description: "Blocks irreversible DB operations: DROP TABLE/DATABASE, TRUNCATE, unsafe DELETE FROM, and migration rollback commands."
    risk_level: blocking
    platforms:
      - macos
    blocks_actions: true
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_ALLOW_DB_DESTRUCTIVE
    profiles:
      - devops
    tests: tests/devops/db-migration-guard.bats

  - id: docker-prod-guard
    category: devops
    path: hooks/devops/docker-prod-guard.sh
    event: PreToolUse
    matcher: Bash
    description: Blocks docker rm/stop/kill/volume rm on containers or volumes whose name contains prod, production, or live.
    risk_level: blocking
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: true
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_ALLOW_DOCKER_PROD
    profiles:
      - devops
    tests: tests/devops/docker-prod-guard.bats

  - id: github-actions-validator
    category: devops
    path: hooks/devops/github-actions-validator.sh
    event: PreToolUse
    matcher: Write
    description: "Validates YAML syntax of GitHub Actions workflow files before they are written. Fires on Write tool calls; payload has tool_input.path and tool_input.content. #"
    risk_level: blocking
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: true
    writes_files: true
    network_access: false
    bypass_env:[]
    profiles:
      - devops
    tests: tests/devops/github-actions-validator.bats

  - id: infra-audit-log
    category: devops
    path: hooks/devops/infra-audit-log.sh
    event: PostToolUse
    matcher: Bash
    description: "Silently logs infrastructure commands (terraform, kubectl, aws, gcloud, helm, docker) to ~/.claude/infra-audit.log. Always exits 0. #"
    risk_level: modifying
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: false
    writes_files: true
    network_access: false
    bypass_env:[]
    profiles:
      - devops
    tests: tests/devops/infra-audit-log.bats

  - id: kubernetes-prod-guard
    category: devops
    path: hooks/devops/kubernetes-prod-guard.sh
    event: PreToolUse
    matcher: Bash
    description: Blocks kubectl commands targeting production clusters or namespaces.
    risk_level: blocking
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: true
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_ALLOW_K8S_PROD
    profiles:
      - devops
    tests: tests/devops/kubernetes-prod-guard.bats

  - id: terraform-destroy-guard
    category: devops
    path: hooks/devops/terraform-destroy-guard.sh
    event: PreToolUse
    matcher: Bash
