    category: security
    path: hooks/security/block-secrets.sh
    event: PreToolUse
    matcher: Write|Edit|MultiEdit
    description: "Scans file content about to be written for hardcoded secrets. Matches common API key, token, and credential patterns. Blocks the write if any pattern is found. # Patterns detected: - OpenAI API key sk-[a-zA-Z0-9]{48} - AWS Access Key ID AKIA[0-9A-Z]{16} - GitHub personal token ghp_[a-zA-Z0-9]{36} - Slack bot token xoxb-[0-9-a-zA-Z]{51} - password assignment password = \"...\" - secret assignment secret = \"...\" - api_key assignment api_key = \"...\""
    risk_level: blocking
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: true
    writes_files: true
    network_access: false
    bypass_env:
      - CLAUDE_ALLOW_SECRETS
    profiles:
      - security
    tests: tests/security/block-secrets.bats

