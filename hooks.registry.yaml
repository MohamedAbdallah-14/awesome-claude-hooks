    event: PreToolUse
    matcher: Bash
    description: "Blocks (or warns on) shell commands that could cause catastrophic, irreversible damage to the system. # Patterns blocked: - rm -rf / variants (rm -rf /, rm -rf /*, rm -rf ~) - Fork bomb: :(){ :|:& };: - Disk wipe: dd if=/dev/zero of=/dev/sd*|/dev/hd*|/dev/nvme* - Filesystem format: mkfs.* - Piped remote execution: curl|wget ... | bash/sh"
    risk_level: blocking
    platforms:
      - macos
      - linux
      - wsl
    blocks_actions: true
    writes_files: true
    network_access: true
    bypass_env:
      - CLAUDE_DANGEROUS_BASH_WARN_ONLY
    profiles:
      - security
    tests: tests/security/block-dangerous-bash.bats

